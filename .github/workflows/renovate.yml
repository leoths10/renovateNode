name: renovate
on:
    pull_request:
        branches: ["dev"]
    push:
        branches: ["dev"]

jobs:
    renovate:
        runs-on: ubuntu-latest
        steps:
            - name: install action
              uses: actions/checkout@v4

            - name: docker && docker compose check
              run:
                docker -v
                docker compose version

            - name: docker up
              run: docker compose up